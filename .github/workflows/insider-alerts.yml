name: Insider Trade Alerts
on:
  schedule:
    - cron: '*/5 11-23,0-6 * * 1-5'
  workflow_dispatch: {}
concurrency:
  group: insider-alerts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check-filings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run insider alert check
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 main.py
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "insider-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen filings"
          git push
